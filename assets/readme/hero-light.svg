8.0px) rotate(0.0deg) scale(1.500);opacity:1}18.500%{transform:translate(538.0px,148.0px) rotate(0.0deg) scale(1.500);opacity:1}21.500%{transform:translate(552.0px,158.0px) rotate(0.0deg) scale(0.800);opacity:0}100%{transform:translate(552.0px,158.0px) rotate(0.0deg) scale(0.800);opacity:0}}.m11{animation:k5 10.0s ease-in-out 0.000s infinite both}@keyframes k6{0.000%{transform:translate(168.0px,155.0px) rotate(0.0deg) scale(1.000);opacity:0}0.800%{transform:translate(168.0px,155.0px) rotate(0.0deg) scale(1.000);opacity:1}6.000%{transform:translate(392.0px,155.0px) rotate(0.0deg) scale(1.000);opacity:1}11.000%{transform:translate(370.0px,248.0px) rotate(-14.0deg) scale(1.000);opacity:0}100%{transform:translate(370.0px,248.0px) rotate(-14.0deg) scale(1.000);opacity:0}}.m13{animation:k6 10.0s ease-in-out 0.500s infinite both}.m14{animation:k6 10.0s ease-in-out 1.000s infinite both}.m15{animation:k1 10.0s linear 2.100s infinite both}.m16{animation:k2 10.0s linear 2.350s infinite both}.m17{animation:k3 10.0s ease-in-out 3.300s infinite both}.m18{animation:k4 10.0s ease-in-out 3.350s infinite both}.m19{animation:k5 10.0s ease-in-out 1.500s infinite both}.m20{animation:k6 10.0s ease-in-out 2.000s infinite both}.m21{animation:k6 10.0s ease-in-out 2.500s infinite both}.m22{animation:k1 10.0s linear 3.600s infinite both}.m23{animation:k2 10.0s linear 3.850s infinite both}.m24{animation:k3 10.0s ease-in-out 4.800s infinite both}.m25{animation:k4 10.0s ease-in-out 4.850s infinite both}.m26{animation:k5 10.0s ease-in-out 3.000s infinite both}.m27{animation:k6 10.0s ease-in-out 3.500s infinite both}.m28{animation:k6 10.0s ease-in-out 4.000s infinite both}.m29{animation:k6 10.0s ease-in-out 4.500s infinite both}.m30{animation:k6 10.0s ease-in-out 5.000s infinite both}.m31{animation:k1 10.0s linear 6.100s infinite both}.m32{animation:k2 10.0s linear 6.350s infinite both}.m33{animation:k3 10.0s ease-in-out 7.300s infinite both}.m34{animation:k4 10.0s ease-in-out 7.350s infinite both