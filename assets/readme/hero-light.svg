<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">kamera's session gate</title>
<desc id="desc">Frames leave the camera every 33 ms, shown 15 times slower. The session gate lets one frame through to the analyzer at a time. Frames that arrive while it is busy are dropped, never queued, and frames shot while focus is settling are skipped. When the analyzer calls close(), the gate opens for the next frame, and only the analyzer's results cross the bridge to Dart or JavaScript.</desc>
