<text x="594" y="103.5" text-anchor="end" style="font-size:11px">start here</text>
<rect x="356" y="122" width="248" height="30" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="366" y="130" width="14" height="14" rx="3" fill="none" stroke="#59636e"/>
