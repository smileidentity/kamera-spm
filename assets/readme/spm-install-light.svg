<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" role="img" aria-labelledby="title desc">
<title id="title">Install kamera-spm</title>
<desc id="desc">Three steps. Add the package github.com/smileidentity/kamera-spm in Xcode at an exact version. Tick the Kamera product; KameraVision is optional; KameraTesting is for tests only. Then import Kamera, and the build succeeds.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e;font-size:13px}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.ink{fill:#1f2328}.b{font-weight:600}.eyebrow{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;letter-spacing:.08em;fill:#59636e}.still{display:none}@media (prefers-reduced-motion:reduce){[class^=m],[class*=' m']{animation:none!important}.moving{display:none}.still{display:inline}}</style>
<style>@keyframes ka0{0.00%{opacity:0}2.22%{opacity:1}26.67%{opacity:1}30.00%{opacity:0}100%{opacity:0}}.m-a0{animation:ka0 9.0s ease-in-out infinite both;opacity:0}@keyframes ka1{0.00%{opacity:0}31.11%{opacity:0}33.33%{opacity:1}55.56%{opacity:1}58.89%{opacity:0}100%{opacity:0}}.m-a1{animation:ka1 9.0s ease-in-out infinite both;opacity:0}@keyframes ka2{0.00%{opacity:0}60.00%{opacity:0}62.22%{opacity:1}91.11%{opacity:1}94.44%{opacity:0}100%{opacity:0}}.m-a2{animation:ka2 9.0s ease-in-out infinite both;opacity:0}@keyframes kurl{0.00%{transform:scaleX(1)}3.33%{transform:scaleX(1)}17.78%{transform:scaleX(0)}95.56%{transform:scaleX(0)}98.89%{transform:scaleX(1)}100%{transform:scaleX(1)}}.m-url{transform-box:fill-box;transform-origin:right;animation:kurl 9.0s linear infinite both;transform:scaleX(0)}@keyframes kchip{0.00%{opacity:0}18.89%{opacity:0}21.11%{opacity:1}95.56%{opacity:1}98.89%{opacity:0}100%{opacity:0}}.m-chip{animation:kchip 9.0s ease-in-out infinite both}@keyframes kpress{0.00%{transform:scale(1)}22.22%{transform:scale(1)}23.33%{transform:scale(.94)}25.00%{transform:scale(1)}100%{transform:scale(1)}}.m-press{transform-box:fill-box;transform-origin:center;animation:kpress 9.0s ease-in-out infinite both}@keyframes ktick{0.00%{opacity:0}37.78%{opacity:0}40.00%{opacity:1}95.56%{opacity:1}98.89%{opacity:0}100%{opacity:0}}.m-tick{animation:ktick 9.0s ease-in-out infinite both}@keyframes kimp{0.00%{transform:scaleX(1)}62.22%{transform:scaleX(1)}72.22%{transform:scaleX(0)}95.56%{transform:scaleX(0)}98.89%{transform:scaleX(1)}100%{transform:scaleX(1)}}.m-imp{transform-box:fill-box;transform-origin:right;animation:kimp 9.0s linear infinite both;transform:scaleX(0)}@keyframes kbuilt{0.00%{opacity:0}76.67%{opacity:0}78.89%{opacity:1}95.56%{opacity:1}98.89%{opacity:0}100%{opacity:0}}.m-built{animation:kbuilt 9.0s ease-in-out infinite both}@keyframes kar0{0.00%{opacity:0;transform:translateX(0)}26.67%{opacity:0;transform:translateX(0)}27.78%{opacity:1;transform:translateX(0)}32.22%{opacity:0;transform:translateX(26px)}100%{opacity:0;transform:translateX(26px)}}.m-ar0{animation:kar0 9.0s ease-out infinite both;opacity:0}@keyframes kar1{0.00%{opacity:0;transform:translateX(0)}55.56%{opacity:0;transform:translateX(0)}56.67%{opacity:1;transform:translateX(0)}61.11%{opacity:0;transform:translateX(26px)}100%{opacity:0;transform:translateX(26px)}}.m-ar1{animation:kar1 9.0s ease-out infinite both;opacity:0}</style>
<rect x="0.5" y="0.5" width="959" height="235" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="24" y="28" width="280" height="180" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<rect class="m-a0" x="24" y="28" width="280" height="180" rx="10" fill="none" stroke="#0a7ea4" stroke-width="2"/>
<circle cx="48" cy="54" r="11" fill="#d9eff7"/>
<text x="48" y="58.5" text-anchor="middle" class="b" style="font-size:12px;fill:#0a7ea4">1</text>
<text x="68" y="58.5" class="eyebrow">ADD THE PACKAGE</text>
<rect x="340" y="28" width="280" height="180" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<rect class="m-a1" x="340" y="28" width="280" height="180" rx="10" fill="none" stroke="#0a7ea4" stroke-width="2"/>
<circle cx="364" cy="54" r="11" fill="#d9eff7"/>
<text x="364" y="58.5" text-anchor="middle" class="b" style="font-size:12px;fill:#0a7ea4">2</text>
<text x="384" y="58.5" class="eyebrow">PICK THE PRODUCT</text>
<rect x="656" y="28" width="280" height="180" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<rect class="m-a2" x="656" y="28" width="280" height="180" rx="10" fill="none" stroke="#0a7ea4" stroke-width="2"/>
<circle cx="680" cy="54" r="11" fill="#d9eff7"/>
<text x="680" y="58.5" text-anchor="middle" class="b" style="font-size:12px;fill:#0a7ea4">3</text>
<text x="700" y="58.5" class="eyebrow">IMPORT IT</text>
<rect x="40" y="82" width="248" height="30" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="50" y="101.5" class="mono ink" style="font-size:10.5px">github.com/smileidentity/kamera-spm</text>
<rect class="m-url" x="48" y="84" width="238" height="26" fill="#f6f8fa" transform="scale(0 1)"/>
<text x="40" y="136" style="font-size:12px">Dependency rule</text>
<g class="m-chip"><rect x="146" y="123" width="106" height="20" rx="10" fill="#d9eff7"/><text x="199" y="137" text-anchor="middle" style="font-size:11.5px;fill:#0a7ea4">Exact Version</text></g>
<g class="m-press"><rect x="168" y="164" width="120" height="28" rx="6" fill="#0a7ea4"/><text x="228" y="182.5" text-anchor="middle" class="b" style="font-size:12px;fill:#ffffff">Add Package</text></g>
