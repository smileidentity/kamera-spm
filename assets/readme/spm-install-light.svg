<text x="594" y="141.5" text-anchor="end" style="font-size:11px">optional</text>
<rect x="356" y="160" width="248" height="30" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="366" y="168" width="14" height="14" rx="3" fill="none" stroke="#59636e"/>
<text x="390" y="179.5" class="mono" style="font-size:12px">KameraTesting</text>
<text x="594" y="179.5" text-anchor="end" style="font-size:11px">for tests only</text>
<rect x="672" y="82" width="248" height="74" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="684" y="104" class="mono" style="font-size:11px">1</text>
<text x="684" y="126" class="mono" style="font-size:11px">2</text>
<text x="702" y="104" class="mono" style="font-size:12px;fill:#0a7ea4">import SwiftUI</text>
<text x="702" y="126" class="mono ink b" style="font-size:12px">import Kamera</text>
<rect class="m-imp" x="700" y="112" width="214" height="20" fill="#f6f8fa" transform="scale(0 1)"/>
<g class="m-built"><rect x="672" y="168" width="146" height="24" rx="12" fill="#1a7f37" opacity=".14"/><path d="M686 180 l4 4 l7 -8" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="184.5" class="b" style="font-size:12px;fill:#1a7f37">Build Succeeded</text></g>
