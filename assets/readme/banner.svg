<style>.ring{animation:ring 3.2s ease-in-out infinite}@keyframes ring{0%,100%{opacity:.15}45%,60%{opacity:.7}}.live{animation:live 2.4s steps(1) infinite}@keyframes live{0%,70%{opacity:1}71%,100%{opacity:.25}}.scan{animation:scan 2.4s ease-in-out infinite}@keyframes scan{0%{transform:translateY(0);opacity:0}15%,85%{opacity:.7}100%{transform:translateY(84px);opacity:0}}.tl{animation:tl 3.2s ease-in-out infinite}@keyframes tl{0%,30%,100%{transform:translate(0,0)}50%,80%{transform:translate(5px,5px)}}.tr{animation:tr 3.2s ease-in-out infinite}@keyframes tr{0%,30%,100%{transform:translate(0,0)}50%,80%{transform:translate(-5px,5px)}}.bl{animation:bl 3.2s ease-in-out infinite}@keyframes bl{0%,30%,100%{transform:translate(0,0)}50%,80%{transform:translate(5px,-5px)}}.br{animation:br 3.2s ease-in-out infinite}@keyframes br{0%,30%,100%{transform:translate(0,0)}50%,80%{transform:translate(-5px,-5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
